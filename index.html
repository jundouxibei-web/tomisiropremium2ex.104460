.title {

.rei{
    margin:2em 0;
    position: relative;
    padding: 0.25em 1em;
    border: solid 2px #2b67e7;
    border-radius: 3px 0 3px 0;
}
.rei:before,.rei:after
{
    content: '';
    position: absolute;
    width:10px;
    height: 10px;
    border: solid 2px #2b67e7;
    border-radius: 50%;
}
.rei:after {
    top:-12px;
    left:-12px;
}
.rei:before {
    bottom:-12px;
    right:-12px;
}
.rei p {
    margin: 0; 
    padding: 0;
}

 .mondaiwaku {

}
.mondaiwaku p {

}

.answaku{

    transition: transform 0.1s ease, box-shadow 0.1s ease;

    margin: 40px auto;

  #totoi11:active {
    transform: translateY(6px);

  }

  #totoi11:hover {
