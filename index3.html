<html>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol&family=Yusei+Magic&display=swap');
    body {
    
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #63f1c6, #48c8ec);
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    
  }
   .mondaiwaku {
    margin: 1em 0;
    background: #fff9dc;
    text-align: center;
    color: #FF00FF
}
.mondaiwaku .box-title {
    font-size: 0.8em;
    background: #ff3300ce;
    padding: 4px;
    text-align: center;
    color: #000000;
    font-weight: bold;
    letter-spacing: 0.05em;
}
.mondaiwaku p {
    text-align: center;
    padding: 15px 20px;
    margin: 0;
}

.answaku{
    padding: 8px 19px;
    margin: 2em 0;
    color: #2c2c2f;
    background: #cde4ff;
    border-top: solid 5px #5989cf;
    border-bottom: solid 5px #5989cf;
    font-size: 10px;
}
.answaku p {
    margin: 0; 
    padding: 0;
}

.ans{
    padding: 0.5em 1em;
    margin: 4em 0;
    background: #f4f4f4;
    border-left: solid 6px #b7665b;
    box-shadow: 0px 2px 3px rgba(0, 0, 0, 0.33);
}
.ans p {
    margin: 0; 
    padding: 0;
}


.toiwaku {
    margin: 1em 0;
    background: #fff9dc;
    text-align: center;
    color: #ffa600
}
.toiwaku .box-toiwaku {
    font-size: 0.8em;
    background: #ff3300ce;
    padding: 4px;
    text-align: center;
    color: #000000;
    font-weight: bold;
    letter-spacing: 0.05em;
}
.toiwaku p {
    text-align: center;
    padding: 15px 20px;
    margin: 0;
}
.kai {
  display: block;
  margin: 20px auto;
  
}

.input-box:focus {
  border-bottom-color: #ff6f61;
}

.kai {
  width: 70%;
  padding: 20px;
  font-size: 30px;
  border-radius: 20px;
  border-width: 10px;
  align-items: center;
  border-color: blanchedalmond;
  outline: none;
}

.kai:focus {
  background-color: #ffffff;
  box-shadow: 0 0 0 2px #ffb74d;
}
 #checktoi12 {
    padding: 20px 50px;
    font-size: 24px;
    font-weight: bold;
    color: white;
    background-color: #4f46e5;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 #3730a3;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    display: block;
    margin: 40px auto;
  }
  

  #checktoi12:active {
    transform: translateY(6px);
    box-shadow: 0 0 0 #3730a3;
  }

  #checktoi12:hover {
    background-color: #4338ca;
  }


</style>
</head>
